 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Quiz - Student Learning Platform</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .quiz-container { max-width: 700px; margin: 20px auto; padding: 20px; }
    .question-box { background: #fff; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    .quiz-choice-btn { display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; cursor: pointer; }
    .quiz-choice-btn.selected { background: #4CAF50; color: white; }
    .timer { font-size: 20px; font-weight: bold; color: #d32f2f; }
    #result-box { display: none; text-align: center; padding: 30px; background: #e8f5e9; border-radius: 10px; }
    button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; background: #2196F3; color: white; }
  </style>
</head>
<body>
  <header>
    <h1 id="quiz-title">Take Quiz</h1>
    <nav><a href="index.html">Home</a> | <a href="quizzes.html">All Quizzes</a> | <a href="results.html">Results</a></nav>
  </header>
  <main class="quiz-container">
    <p>Time Left: <span class="timer" id="timer">10:00</span></p>
    <p id="progress">Question 1 of 3</p>
    <p>Score: <span id="score-display">0</span></p>
    <div id="quiz-box">
      <div class="question-box">
        <h2 id="question-text"></h2>
        <div id="choices-container"></div>

      </div>
      <button onclick="prevQuestion()">Previous</button>
      <button id="next-question-btn" onclick="nextQuestion()">Next</button>
      <button id="submit-quiz-btn" onclick="submitQuiz()" style="background:#4CAF50;">Submit Quiz</button>
    </div>
    <div id="result-box">
      <h2>Quiz Finished! 🎉</h2>
      <p id="final-score" style="font-size:24px; font-weight:bold;"></p>
      <p id="feedback"></p>
      <a href="quizzes.html"><button>Try Another Quiz</button></a>
    </div>
  </main>
  <footer><p><a href="quizzes.html">Back to Quizzes</a></p></footer>
  <script>
    const allQuizzes = {
      math: { title: "Mathematics Quiz", questions: [
        { q: "What is 12 + 8?", options: ["18", "20", "22", "15"], answer: 1 },
        { q: "What is 5 x 6?", options: ["25", "30", "35", "28"], answer: 1 },
        { q: "What is the square root of 81?", options: ["7", "8", "9", "10"], answer: 2 }
      ]},
      english: { title: "English Quiz", questions: [
        { q: "Choose the correct sentence:", options: ["She go to school", "She goes to school", "She going to school", "She goed to school"], answer: 1 },
        { q: "What is the plural of 'child'?", options: ["Childs", "Childes", "Children", "Childrens"], answer: 2 },
        { q: "Which word is a verb?", options: ["Happy", "Run", "Blue", "Table"], answer: 1 }
      ]},
      science: { title: "Science Quiz", questions: [
        { q: "What is H2O?", options: ["Salt", "Water", "Oxygen", "Carbon"], answer: 1 },
        { q: "Which planet is closest to the Sun?", options: ["Venus", "Earth", "Mercury", "Mars"], answer: 2 },
        { q: "What do plants need for photosynthesis?", options: ["Moonlight", "Sunlight", "Darkness", "Snow"], answer: 1 }
      ]},
      history: { title: "History Quiz", questions: [
        { q: "Who was the first President of Rwanda?", options: ["Paul Kagame", "Gregoire Kayibanda", "Juvenal Habyarimana", "Pasteur Bizimungu"], answer: 1 },
        { q: "In which year did Rwanda gain independence?", options: ["1960", "1962", "1973", "1994"], answer: 1 },
        { q: "World War II ended in which year?", options: ["1943", "1944", "1945", "1946"], answer: 2 }
      ]}
    };
    const params = new URLSearchParams(window.location.search);
    const quizKey = params.get('quiz') || 'math';
    const quiz = allQuizzes[quizKey] || allQuizzes['math'];
    document.getElementById('quiz-title').textContent = quiz.title;
    let current = 0;
    let userAnswers = new Array(quiz.questions.length).fill(null);
    let timeLeft = 600;
    let timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      document.getElementById('timer').textContent = m + ':' + (s < 10 ? '0' + s : s);
      if (timeLeft <= 0) { clearInterval(timerInterval); submitQuiz(); }
    }, 1000);
    function showQuestion() {
      const q = quiz.questions[current];
      document.getElementById('question-text').textContent = (current + 1) + '. ' + q.q;
      document.getElementById('progress').textContent = `Question ${current + 1} of ${quiz.questions.length}`;
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
      btn.className = 'quiz-choice-btn' + (userAnswers[current] === i ? ' selected' : '');
        btn.textContent = opt;
        btn.onclick = () => { userAnswers[current] = i; showQuestion(); };
        optionsDiv.appendChild(btn);
      });
    }
    function nextQuestion() { if (current < quiz.questions.length - 1) { current++; showQuestion(); } }
    function prevQuestion() { if (current > 0) { current--; showQuestion(); } }
    function submitQuiz() {
      clearInterval(timerInterval);
      let score = 0;
      quiz.questions.forEach((q, i) => { if (userAnswers[i] === q.answer) score++; });
      document.getElementById('score-display').textContent = score;
      document.getElementById('quiz-box').style.display = 'none';
      document.getElementById('result-box').style.display = 'block';
      document.getElementById('final-score').textContent = `You scored ${score} / ${quiz.questions.length}`;
      document.getElementById('feedback').textContent = score === quiz.questions.length ? 'Excellent! Perfect score!' : score >= 2 ? 'Good job! Keep practicing!' : 'Keep studying, you can do better!';
      localStorage.setItem('latestQuizScore', score);
      localStorage.setItem('totalQuestions', quiz.questions.length);
    }
    showQuestion();
  </script>
</body>
</html>
